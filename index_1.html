<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vidya Global School — Leave a Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FBF7F0;
    --ink: #33302A;
    --ink-soft: #6B655C;
    --sky: #AFC9DE;
    --blush: #F0B8AE;
    --sage: #C3D8B7;
    --butter: #F3DE9A;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Karla', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    position: relative;
    overflow: hidden;
  }

  /* soft floating blobs behind everything */
  .blob{
    position: absolute;
    border-radius: 44% 56% 62% 38% / 42% 46% 54% 58%;
    opacity: 0.55;
    z-index: 0;
  }
  .blob.b1{ width: 260px; height: 260px; background: var(--sky); top: -70px; left: -60px; }
  .blob.b2{ width: 220px; height: 220px; background: var(--blush); bottom: -60px; right: -50px; }
  .blob.b3{ width: 140px; height: 140px; background: var(--sage); bottom: 12%; left: 6%; opacity: 0.4; }

  .card{
    position: relative;
    z-index: 1;
    background: #fff;
    border-radius: 28px;
    padding: 48px 40px 40px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    box-shadow: 0 24px 48px rgba(51,48,42,0.08);
  }

  .eyebrow-mark{
    width: 42px;
    height: 42px;
    margin: 0 auto 18px;
    background: var(--butter);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fraunces', serif;
    font-size: 20px;
  }

  h1{
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 26px;
    line-height: 1.25;
    margin: 0 0 8px;
  }

  p.lede{
    color: var(--ink-soft);
    font-size: 15px;
    margin: 0 0 30px;
    line-height: 1.55;
  }

  .qr-frame{
    background: var(--butter);
    border-radius: 22px;
    padding: 18px;
    display: inline-block;
    margin-bottom: 22px;
  }
  .qr-code-box{
    width: 200px;
    height: 200px;
    background: #FFFDF6;
    border: 2px dashed rgba(51,48,42,0.3);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .qr-code-box img{
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  .qr-code-box .placeholder-note{
    font-size: 12.5px;
    text-align: center;
    color: var(--ink-soft);
    padding: 10px;
    line-height: 1.4;
  }

  .scan-hint{
    font-size: 13.5px;
    color: var(--ink-soft);
  }

  footer{
    margin-top: 26px;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 15px;
    color: var(--ink-soft);
  }
</style>
</head>
<body>

<div class="blob b1" aria-hidden="true"></div>
<div class="blob b2" aria-hidden="true"></div>
<div class="blob b3" aria-hidden="true"></div>

<div class="card">
  <div class="eyebrow-mark">✿</div>
  <h1>How was your experience<br>with Vidya Global School?</h1>
  <p class="lede">Scan the code below to share a quick review — it takes less than a minute.</p>

  <div class="qr-frame">
    <div class="qr-code-box">
      <!--
        Replace this with your own QR code:
        Save your QR image as "qr-code.png" next to this HTML file,
        and it will appear here automatically.
      -->
      <img src="qr-code.png" alt="Scan to leave a review" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
      <div class="placeholder-note" style="display:flex; align-items:center; justify-content:center; height:100%;">
        Your QR<br>goes here
      </div>
    </div>
  </div>

  <p class="scan-hint">Open your camera app and point it at the code.</p>

  <footer>Vidya Global School</footer>
</div>

</body>
</html>
